<!DOCTYPE html>
<html lang="mr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>कालाची पाठशाळा | 100×5 परीक्षा</title>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Devanagari:wght@400;700;800&display=swap" rel="stylesheet" />
  <style>
    :root{--bg:#07160f;--card:#123226;--line:#1e4a38;--text:#effaf3;--muted:#a9c7b6;--green:#3ee08f;--gold:#f3c15a;--danger:#ff8b8b}
    *{box-sizing:border-box;margin:0;padding:0}
    body{font-family:"Noto Sans Devanagari",sans-serif;background:radial-gradient(900px 400px at 8% -8%,#145536,transparent 50%),var(--bg);color:var(--text);line-height:1.5}
    .wrap{width:min(980px,93%);margin:0 auto}
    header{position:sticky;top:0;background:rgba(7,22,15,.93);border-bottom:1px solid var(--line);padding:12px 0;font-weight:800}
    .btn{border:0;font:inherit;cursor:pointer;background:var(--green);color:#062015;font-weight:700;padding:10px 14px;border-radius:12px}
    .btn.ghost{background:transparent;color:var(--text);border:1px solid var(--line)}
    h1{font-size:1.6rem;margin:16px 0 8px}
    .muted{color:var(--muted)}
    .warn{background:#2a2410;border:1px solid #5b4a1b;color:var(--gold);padding:10px;border-radius:12px;margin:12px 0}
    .card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin:10px 0}
    select{width:100%;padding:11px;border-radius:12px;background:#0b1f17;color:var(--text);border:1px solid var(--line);font:inherit;margin:8px 0}
    .opt{display:block;width:100%;text-align:left;margin-top:8px;padding:10px;border-radius:12px;border:1px solid var(--line);background:#0b1f17;color:var(--text);font:inherit}
    .opt.picked{border-color:#7ad7ff;background:#14344a}
    .bar{height:10px;background:#0b1f17;border-radius:99px;overflow:hidden;margin:8px 0}
    .bar>i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--green),var(--gold))}
    .row{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
    .rev{border-top:1px solid var(--line);margin-top:10px;padding-top:8px}
    footer{color:var(--muted);padding:20px 0 36px;border-top:1px solid var(--line)}
  </style>
</head>
<body>
  <header><div class="wrap">कालाची पाठशाळा</div></header>
  <main class="wrap">
    <h1>प्रत्येक विषयात 100 प्रश्न</h1>
    <p class="muted">उत्तर क्लिक करताच दिसणार नाही. 100 सोडवल्यावर निकाल.</p>
    <div class="warn">सराव प्रश्न. अधिकृत पेपर नाहीत. तारीख/कलम अधिकृत साइटवर तपासा.</div>
    <div class="card">
      <label for="sub">विषय निवडा</label>
      <select id="sub">
        <option value="upsc">UPSC — 100</option>
        <option value="mpsc">MPSC — 100</option>
        <option value="neet">NEET — 100</option>
        <option value="history">इतिहास — 100</option>
        <option value="police">पोलिस भरती — 100</option>
      </select>
      <button class="btn" id="start" type="button">परीक्षा सुरू</button>
    </div>
    <div class="card">
      <div class="bar"><i id="bar"></i></div>
      <div id="box">विषय निवडून परीक्षा सुरू करा.</div>
      <div class="row">
        <button class="btn ghost" id="prev" type="button">मागील</button>
        <button class="btn" id="next" type="button">पुढचा</button>
        <span class="muted" id="st"></span>
      </div>
    </div>
  </main>
  <footer><div class="wrap">एकच लिंक वापरा. नव्या फाइल-लिंकची गरज नाही.</div></footer>
  <script>

 ["सिंह", "वाघ", "हत्ती", "मोर"], "a": 1, "w": "वाघ."}, {"q": "भारताचे राष्ट्रीय पक्षी कोणते?", "o": ["गरुड", "मोर", "कावळा", "पोपट"], "a": 1, "w": "मोर."}, {"q": "भारताचे राष्ट्रीय फूल कोणते?", "o": ["गुलाब", "कमल", "मोगरा", "सूर्यफूल"], "a": 1, "w": "कमल."}, {"q": "अशोक चक्राला किती आरे आहेत?", "o": ["12", "24", "36", "48"], "a": 1, "w": "24."}, {"q": "तिरंगी झेंड्यातील मध्यचा रंग कोणता?", "o": ["केशरी", "सफेद", "हिरवा", "निळा"], "a": 1, "w": "सफेद."}, {"q": "भारताची राजधानी कोणती?", "o": ["मुंबई", "कोलकाता", "नवी दिल्ली", "हैदराबाद"], "a": 2, "w": "नवी दिल्ली."}, {"q": "पंतप्रधान कोणाकडे शपथ घेतात?", "o": ["मुख्य न्यायाधीश", "राष्ट्रपती", "लोकसभा अध्यक्ष", "उपराष्ट्रपती"], "a": 1, "w": "राष्ट्रपती."}, {"q": "राज्यसभेच्या सदस्यांचा कालावधी किती वर्षे?", "o": ["4", "5", "6", "2"], "a": 2, "w": "6 वर्षे."}, {"q": "भारतात मतदानाचे किमान वय किती?", "o": ["16", "18", "21", "25"], "a": 1, "w": "18 वर्षे."}, {"q": "GST चे पूर्ण रूप काय?", "o": ["General Sales Tax", "Goods and Services Tax", "Government State Tax", "Gross Service Tax"], "a": 1, "w": "Goods and Services Tax."}, {"q": "रिझर्व्ह बँक ऑफ इंडिया कोणत्या वर्षी स्थापन झाली?", "o": ["1935", "1947", "1950", "1991"], "a": 0, "w": "1935."}, {"q": "संयुक्त राष्ट्र संघटना कोणत्या वर्षी स्थापन?", "o": ["1919", "1945", "1947", "1950"], "a": 1, "w": "1945."}, {"q": "जागतिक पर्यावरण दिन कोणता?", "o": ["5 जून", "22 एप्रिल", "21 मार्च", "16 सप्टेंबर"], "a": 0, "w": "5 जून."}, {"q": "आंतरराष्ट्रीय योग दिन कोणता?", "o": ["21 जून", "21 डिसेंबर", "2 ऑक्टोबर", "14 एप्रिल"], "a": 0, "w": "21 जून."}, {"q": "मानव अधिकार दिन कोणता?", "o": ["26 जानेवारी", "10 डिसेंबर", "15 ऑगस्ट", "2 ऑक्टोबर"], "a": 1, "w": "10 डिसेंबर."}, {"q": "हार्ट ऑफ इंडिया कोणते राज्य म्हटले जाते?", "o": ["उत्तर प्रदेश", "मध्य प्रदेश", "राजस्थान", "बिहार"], "a": 1, "w": "मध्य प्रदेश."}, {"q": "क्षेत्रफळाने भारतातील सर्वात मोठे राज्य?", "o": ["उत्तर प्रदेश", "राजस्थान", "महाराष्ट्र", "बिहार"], "a": 1, "w": "राजस्थान."}, {"q": "लोकसंख्येने भारतातील सर्वात मोठे राज
